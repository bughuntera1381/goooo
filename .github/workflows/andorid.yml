name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
      PROJECT_PATH: "."
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ۱. استفاده از نسخه پایدارتر اکشن برای جلوگیری از خطای 404
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      # ۲. نصب دستی ابزارهای خط فرمان برای اطمینان از صحت مسیر
      - name: Install cmdline-tools manually
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          # دانلود از آدرس معتبر و جدید گوگل
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest

      # ۳. نصب پکیج‌های مورد نیاز Godot 4.3 (Build Tools 34 و Platform 34)
      - name: Install Android Build Tools and Platform
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup templates and debug keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          
          # تنظیم مسیرهای دقیق SDK و Java برای Godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2

      - name: Import and export
        run: |
          godot --headless --import --path . || true
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/ApexArena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ApexArena-apk
          path: build/ApexArena.apk
